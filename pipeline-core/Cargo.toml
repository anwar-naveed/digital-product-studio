[package]
name = "pipeline-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["full", "macros", "rt-multi-thread"] }
futures = "0.3"

# Web framework
axum = { version = "0.8.9", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7.1", features = ["limit", "trace", "cors", "normalize-path"] }

# Database
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal"] }
uuid = { version = "1.8", features = ["serde", "v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = { version = "0.14", features = ["yaml"] }

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.27"
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace"] }

# Security
ring = "0.17"
subtle = "2.5"
hex = "0.4"
argon2 = "0.5"

# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls", "stream", "multipart", "query"] }

# Utilities
thiserror = "2.0"
anyhow = "1.0"
rand = "0.8"
sha2 = "0.10"

# Object storage (S3/MinIO)
object_store = { version = "0.14.2", features = ["aws"] }

# JSON Schema generation
validator = { version = "0.20", features = ["derive"] }
jsonwebtoken = "9"
schemars = { version = "0.8.21", features = ["uuid1", "chrono", "rust_decimal"] }

# File watching
notify = "6.1"

[dev-dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio-test = "0.4"
mockito = "1.3"
testcontainers = "0.19"
pretty_assertions = "1.4"

[build-dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }

[[bin]]
name = "pipeline-core"
path = "src/main.rs"
[features]
default = []
s3-integration = []
api-integration = []
