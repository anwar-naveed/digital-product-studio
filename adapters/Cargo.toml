[package]
name = "adapters"
version = "0.1.0"
edition = "2021"
description = "Platform adapters for digital product publishing (Etsy, Lemon Squeezy, Printify, Gelato)"

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["full", "macros", "rt-multi-thread"] }
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.13", features = ["json", "multipart", "rustls", "stream", "form", "query"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Decimal
rust_decimal = { version = "1.36", features = ["serde"] }

# Cryptography
ring = "0.17"
subtle = "2.5"
hex = "0.4"

# Rate limiting / middleware
tower = "0.5"
tower-http = { version = "0.7", features = ["limit"] }

# Tracing
tracing = "0.1"

# Error handling
thiserror = "2.0"

# Random for jitter
rand = "0.8"

# Base64 encoding
base64 = "0.23"

# UUID
uuid = { version = "1.8", features = ["v4", "serde"] }

# URL parsing
url = "2.5"

# Workspace crates
pipeline-core = { path = "../pipeline-core" }

[dev-dependencies]
# Testing
tokio-test = "0.4"
mockito = "1.3"
wiremock = "0.5"


