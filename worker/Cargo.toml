[package]
name = "pipeline-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
pipeline-core = { path = "../pipeline-core" }

# Database (lib code uses PgPool for job polling)
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal"] }

# Async runtime
tokio = { version = "1.53", features = ["full", "macros", "rt-multi-thread"] }

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Utilities
thiserror = "2.0"
anyhow = "1.0"
rand = "0.8"
uuid = { version = "1.8", features = ["serde", "v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# HTTP client (for S3)
reqwest = { version = "0.13", features = ["json", "rustls", "stream", "multipart", "query"] }

# Object storage (S3/MinIO)
object_store = { version = "0.14.2", features = ["aws"] }

# JSON Schema generation
schemars = { version = "0.8.21", features = ["uuid1", "chrono", "rust_decimal"] }
jsonschema = "0.19"

[dev-dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio-test = "0.4"
mockito = "1.3"
testcontainers = "0.19"
pretty_assertions = "1.4"
proptest = "1.4"

[[bin]]
name = "pipeline-worker"
path = "src/main.rs"