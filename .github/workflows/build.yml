name: build

# THE ONLY BUILD PIPELINE (HARD CLAUSE 2). All images are built on GitHub-hosted
# runners and pushed to Docker Hub — to the PRIVATE navanwar021/work-repo
# monorepo (established convention: one private repo, tag = <service>-<date>-<sha>).
# This server PULLS images; nothing is ever built locally (HARD CLAUSE 1).
# Contract: github-actions-build-contract skill + openship-deployment ref 04.

on:
  push:
    branches: [main]
    paths:
      - 'pipeline-core/**'
      - 'worker/**'
      - 'adapters/**'
      - 'admin-ui/**'
      - 'deploy/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE_REPO: navanwar021/work-repo

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.tag.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] || { echo "::error::DOCKERHUB_TOKEN secret is not set"; exit 1; }
          [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] || { echo "::error::DOCKERHUB_USER secret is not set"; exit 1; }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute tag
        id: tag
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          TAG="dps-core-$DATE-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build + push pipeline-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.core
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_REPO }}:dps-core-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  worker:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.tag.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute tag
        id: tag
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          TAG="dps-worker-$DATE-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build + push pipeline-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_REPO }}:dps-worker-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ui:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.tag.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute tag
        id: tag
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          TAG="dps-ui-$DATE-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build + push admin-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.ui
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_REPO }}:dps-ui-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tools:
    # Tool sandbox images the worker spawns (pinned versions in the tag).
    # NEEDS worker: the craft CLI images layer on the worker image
    # (RUNTIME_IMAGE), which must be pushed to work-repo first.
    needs: [worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build + push photocraft-cli
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.tools
          target: photocraft
          build-args: |
            RUNTIME_IMAGE=${{ env.IMAGE_REPO }}:dps-worker-latest
          push: true
          tags: ${{ env.IMAGE_REPO }}:dps-photocraft-cli-0.7.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build + push vectorcraft-cli
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.tools
          target: vectorcraft
          build-args: |
            RUNTIME_IMAGE=${{ env.IMAGE_REPO }}:dps-worker-latest
          push: true
          tags: ${{ env.IMAGE_REPO }}:dps-vectorcraft-cli-0.9.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build + push cf-image-gen
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile.cfimagegen
          push: true
          tags: ${{ env.IMAGE_REPO }}:dps-cf-image-gen-0.7.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build + push product-assembly
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile.assembly
          push: true
          tags: ${{ env.IMAGE_REPO }}:dps-product-assembly-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    # Runs the test suites INSIDE ephemeral containers (HARD CLAUSE 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust workspace tests (core + worker)
        run: |
          docker run --rm -v "$PWD":/ws -w /ws rust:1.99-trixie \
            sh -c 'cargo test --workspace --lib'
      - name: Admin UI typecheck + unit tests
        run: |
          docker run --rm -v "$PWD/admin-ui":/app -w /app node:22-bookworm-slim \
            sh -c 'npm ci --no-audit --no-fund && npx tsc --noEmit && npm run test'

  release:
    # Pin the freshly built images in .env so openship deploys exactly these.
    needs: [core, worker, ui, tools, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update .env with pinned image refs
        # NOTE: job outputs containing the Docker Hub username are masked to
        # empty by GitHub's secret masking (the username IS a secret). So the
        # pins are reconstructed here from the literal repo + the run SHA —
        # the exact tags the core/worker/ui jobs pushed.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          SHA7=${GITHUB_SHA::7}
          sed -i "s|^CORE_IMAGE=.*|CORE_IMAGE=navanwar021/work-repo:dps-core-${{ needs.core.outputs.build_date }}-$SHA7|" .env
          sed -i "s|^WORKER_IMAGE=.*|WORKER_IMAGE=navanwar021/work-repo:dps-worker-${{ needs.worker.outputs.build_date }}-$SHA7|" .env
          sed -i "s|^UI_IMAGE=.*|UI_IMAGE=navanwar021/work-repo:dps-ui-${{ needs.ui.outputs.build_date }}-$SHA7|" .env
          sed -i "s|^TOOL_IMAGE_PREFIX=.*|TOOL_IMAGE_PREFIX=navanwar021/work-repo:dps-|" .env
          git add .env
          git commit -m "release: pin images for ${{ github.sha }} [skip ci]" || echo "nothing to commit"
          git push origin main
      - name: Summary
        run: |
          echo "### Images released to work-repo" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "CORE_IMAGE=navanwar021/work-repo:dps-core-${{ needs.core.outputs.build_date }}-$SHA7" >> "$GITHUB_STEP_SUMMARY"
          echo "WORKER_IMAGE=navanwar021/work-repo:dps-worker-${{ needs.worker.outputs.build_date }}-$SHA7" >> "$GITHUB_STEP_SUMMARY"
          echo "UI_IMAGE=navanwar021/work-repo:dps-ui-${{ needs.ui.outputs.build_date }}-$SHA7" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
