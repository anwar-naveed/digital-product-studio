name: build

# THE ONLY BUILD PIPELINE (HARD CLAUSE 2). All images are built on GitHub-hosted
# runners and pushed to Docker Hub. This server PULLS images; nothing is ever
# built locally (HARD CLAUSE 1). The host stays clean at all times (HARD CLAUSE 4).

on:
  push:
    branches: [main]
    paths:
      - 'pipeline-core/**'
      - 'worker/**'
      - 'adapters/**'
      - 'admin-ui/**'
      - 'deploy/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  # Owner/repo set via repo variables so the workflow is fork-friendly
  IMAGE_PREFIX: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build + push pipeline-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.core
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/digital-product-studio-core:latest
            ${{ env.IMAGE_PREFIX }}/digital-product-studio-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build + push pipeline-worker (with pinned craft CLIs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/digital-product-studio-worker:latest
            ${{ env.IMAGE_PREFIX }}/digital-product-studio-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build + push admin-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.ui
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/digital-product-studio-ui:latest
            ${{ env.IMAGE_PREFIX }}/digital-product-studio-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    # Runs the test suites INSIDE ephemeral containers (HARD CLAUSE 3)
    runs-on: ubuntu-latest
    needs: [core, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust test suites in a builder container (sqlx offline cache)
        run: |
          docker run --rm \
            -v "$PWD":/workspace -w /workspace \
            -e SQLX_OFFLINE=true \
            rust:1.99-trixie \
            sh -c "cargo test --workspace --lib"
      - name: Run admin-ui vitest in a node container
        run: |
          docker run --rm \
            -v "$PWD/admin-ui":/app -w /app \
            node:22-bookworm-slim \
            sh -c "npm install --no-audit --no-fund && npm run test"

  release:
    runs-on: ubuntu-latest
    needs: [core, worker, ui, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Release marker
        run: echo "images pushed for ${{ github.sha }}; server pulls via Openship"
