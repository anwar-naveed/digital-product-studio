# admin-ui static site + API proxy to pipeline-core.
# In the Openship deployment the API proxy is handled by Pingap
# (host studio.amzankos.local -> /api/* -> pipeline-core). This conf serves
# the static bundle and a healthz endpoint; /api/ proxy block is kept as the
# direct-to-core fallback for local (non-Pingap) usage.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (S7 from docs/10-security-research.md)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'none'" always;

    # Immutable hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health endpoint for the container HEALTHCHECK / Openship
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API fallback proxy (Pingap is the primary edge; this is local-dev only)
    location /api/ {
        proxy_pass http://pipeline-core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
