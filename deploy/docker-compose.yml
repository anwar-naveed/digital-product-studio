version: "3.8"

# Openship-compatible compose (see devops/openship-deployment skill):
# - images come from Docker Hub (built by GitHub Actions — HARD CLAUSE 2)
# - no env_file: (unsupported); ${VAR:?} required, ${VAR:-default} optional
# - ports publish on the shared-network gateway only (172.19.0.1)
# - NO minio service: storage is the existing shared-minio project (deploy/minio.md)

services:
  postgres:
    image: ${POSTGRES_IMAGE:-supabase/postgres:16.1.0.39}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-digital_product_studio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    user: "999:999"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  pipeline-core:
    image: ${CORE_IMAGE:?CI-pushed image tag required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://172.19.0.1:9010}
      S3_BUCKET: ${S3_BUCKET:-digital-product-studio}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      APP__DATABASE__MAX_CONNECTIONS: ${APP__DATABASE__MAX_CONNECTIONS:-10}
      APP__DATABASE__MIN_CONNECTIONS: ${APP__DATABASE__MIN_CONNECTIONS:-2}
      APP__S3__REGION: ${APP__S3__REGION:-us-east-1}
      APP__S3__USE_SSL: ${APP__S3__USE_SSL:-false}
      APP__SERVER__HOST: ${APP__SERVER__HOST:-0.0.0.0}
      APP__SERVER__PORT: ${APP__SERVER__PORT:-8080}
      APP__SERVER__BODY_LIMIT_MB: ${APP__SERVER__BODY_LIMIT_MB:-16}
      APP__JWT__EXPIRY_HOURS: ${APP__JWT__EXPIRY_HOURS:-24}
      APP__JWT__ISSUER: ${APP__JWT__ISSUER:-digital-product-studio}
      APP__AUDIT__OTLP_ENDPOINT: ${APP__AUDIT__OTLP_ENDPOINT:-}
      APP__AUDIT__SERVICE_NAME: ${APP__AUDIT__SERVICE_NAME:-digital-product-studio}
      APP__TRACING__LEVEL: ${APP__TRACING__LEVEL:-info}
      ETSY_CLIENT_KEY: ${ETSY_CLIENT_KEY:-}
      ETSY_CLIENT_SECRET: ${ETSY_CLIENT_SECRET:-}
      ETSY_REFRESH_TOKEN: ${ETSY_REFRESH_TOKEN:-}
      LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY:-}
      PRINTIFY_API_KEY: ${PRINTIFY_API_KEY:-}
      GELATO_API_KEY: ${GELATO_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info,pipeline_core=debug}
    ports:
      - "${HOST_BIND_IP:-172.19.0.1}:${CORE_PORT:-3082}:8080"
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    tmpfs:
      - /tmp

  pipeline-worker:
    image: ${WORKER_IMAGE:?CI-pushed image tag required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pipeline-core:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://172.19.0.1:9010}
      S3_BUCKET: ${S3_BUCKET:-digital-product-studio}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      APP__DATABASE__MAX_CONNECTIONS: ${APP__DATABASE__MAX_CONNECTIONS:-10}
      APP__DATABASE__MIN_CONNECTIONS: ${APP__DATABASE__MIN_CONNECTIONS:-2}
      APP__S3__REGION: ${APP__S3__REGION:-us-east-1}
      APP__S3__USE_SSL: ${APP__S3__USE_SSL:-false}
      APP__SERVER__HOST: ${APP__SERVER__HOST:-0.0.0.0}
      APP__SERVER__PORT: ${APP__SERVER__PORT:-8081}
      APP__SERVER__BODY_LIMIT_MB: ${APP__SERVER__BODY_LIMIT_MB:-16}
      APP__JWT__EXPIRY_HOURS: ${APP__JWT__EXPIRY_HOURS:-24}
      APP__JWT__ISSUER: ${APP__JWT__ISSUER:-digital-product-studio}
      APP__AUDIT__OTLP_ENDPOINT: ${APP__AUDIT__OTLP_ENDPOINT:-}
      APP__AUDIT__SERVICE_NAME: ${APP__AUDIT__SERVICE_NAME:-digital-product-studio}
      APP__TRACING__LEVEL: ${APP__TRACING__LEVEL:-info}
      WORKER_POLL_INTERVAL_SECS: ${WORKER_POLL_INTERVAL_SECS:-5}
      RUST_LOG: ${RUST_LOG:-info,worker=debug}
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    volumes:
      - staging:/var/staging
    tmpfs:
      - /tmp

  admin-ui:
    image: ${UI_IMAGE:?CI-pushed image tag required}
    restart: unless-stopped
    depends_on:
      - pipeline-core
    ports:
      - "${HOST_BIND_IP:-172.19.0.1}:${UI_PORT:-3081}:8080"
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    tmpfs:
      - /var/cache/nginx
      - /var/run

volumes:
  pgdata:
  staging:
